<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="egressFlowTitle egressFlowDesc">
  <title id="egressFlowTitle">Dedicated Egress IP flow for AEM Forms submissions to Azure Blob Storage</title>
  <desc id="egressFlowDesc">AEM Forms submission flows through the Dedicated Egress IP outbound proxy to the Azure Storage firewall, which checks the source IP against its allowlist. If allowed, the submission is stored. If denied, the request fails with a 403 AuthorizationFailure error.</desc>

  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="460" fill="#FFFFFF"/>

  <!-- Box 1: AEM Forms submission -->
  <rect x="170" y="20" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="320" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#000000">AEM Forms submission</text>

  <line x1="320" y1="80" x2="320" y2="114" stroke="#000000" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Box 2: Dedicated Egress IP -->
  <rect x="130" y="120" width="380" height="60" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="320" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#000000">Dedicated Egress IP</text>
  <text x="320" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A5A5A">(outbound proxy)</text>

  <line x1="320" y1="180" x2="320" y2="214" stroke="#000000" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Box 3: Azure Storage firewall -->
  <rect x="110" y="220" width="420" height="70" rx="6" fill="#D6EAF8" stroke="#000000" stroke-width="2"/>
  <text x="320" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#000000">Azure Storage firewall</text>
  <text x="320" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">(IP allowlist check)</text>

  <!-- Branch lines -->
  <line x1="260" y1="290" x2="160" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arrowHead)"/>
  <line x1="380" y1="290" x2="480" y2="330" stroke="#000000" stroke-width="2" marker-end="url(#arrowHead)"/>

  <text x="185" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">Allowed</text>
  <text x="465" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">Denied</text>

  <!-- Outcome box: Allowed -->
  <rect x="20" y="335" width="280" height="70" rx="6" fill="#D6EAF8" stroke="#000000" stroke-width="2"/>
  <path d="M45,370 L55,380 L75,355" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000">Submission stored</text>
  <text x="170" y="385" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">in Azure Blob Storage</text>

  <!-- Outcome box: Denied -->
  <rect x="340" y="335" width="280" height="70" rx="6" fill="#E8E8E8" stroke="#000000" stroke-width="2"/>
  <path d="M362,358 L376,372 M376,358 L362,372" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <text x="490" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000">403 AuthorizationFailure</text>
  <text x="490" y="385" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">request rejected</text>
</svg>
